<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Machine</title>
    <script defer src="script.js"></script>
    <style>
        body {
            text-align: center;
            font-size: 25px;
        }
    </style>
</head>
<body>

    <h1 id="num">0</h1>
    <button id="inc" onclick="increasecount()">increase</button>
    <button id="dec" onclick="decreasecount()">decrease</button>
    <button id="res" onclick="resetcount()">reset</button>
    
</body>
</html>
